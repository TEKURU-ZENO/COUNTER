<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <style>
      .state { rx: 8; ry: 8; stroke-width: 2; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .normal { fill: #1e293b; stroke: #38bdf8; }
      .final { fill: #064e3b; stroke: #34d399; }
      .terminal { fill: #450a0a; stroke: #f87171; }
      .state-txt { fill: #f8fafc; }
      .label-txt { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
      .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-accent { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead-accent); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" fill="#0f172a" rx="12" />

  <!-- Title -->
  <text x="30" y="38" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">COUNTER Order Engine State Machine</text>
  <text x="30" y="58" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Deterministic, optimistic-locked state transitions with cryptographic quote verification</text>

  <!-- Happy Path States -->
  <!-- DRAFT -->
  <rect x="50" y="140" width="100" height="44" class="state normal" />
  <text x="100" y="167" class="state-txt">DRAFT</text>

  <!-- QUOTED -->
  <rect x="220" y="140" width="110" height="44" class="state normal" />
  <text x="275" y="167" class="state-txt">QUOTED</text>

  <!-- LINK_SENT -->
  <rect x="400" y="140" width="120" height="44" class="state normal" />
  <text x="460" y="167" class="state-txt">LINK_SENT</text>

  <!-- APPROVED -->
  <rect x="590" y="140" width="120" height="44" class="state normal" />
  <text x="650" y="167" class="state-txt">APPROVED</text>

  <!-- CAPTURED -->
  <rect x="780" y="140" width="120" height="44" class="state final" />
  <text x="840" y="167" class="state-txt">CAPTURED</text>

  <!-- IN_KITCHEN -->
  <rect x="780" y="270" width="120" height="44" class="state normal" />
  <text x="840" y="297" class="state-txt">IN_KITCHEN</text>

  <!-- READY -->
  <rect x="590" y="270" width="120" height="44" class="state normal" />
  <text x="650" y="297" class="state-txt">READY</text>

  <!-- PICKED_UP -->
  <rect x="400" y="270" width="120" height="44" class="state final" />
  <text x="460" y="297" class="state-txt">PICKED_UP</text>

  <!-- Secondary/Terminal States -->
  <!-- CANCELLED -->
  <rect x="135" y="390" width="120" height="44" class="state terminal" />
  <text x="195" y="417" class="state-txt">CANCELLED</text>

  <!-- LINK_EXPIRED -->
  <rect x="400" y="40" width="120" height="40" class="state terminal" />
  <text x="460" y="65" class="state-txt">LINK_EXPIRED</text>

  <!-- REFUNDED_FULL -->
  <rect x="780" y="40" width="130" height="40" class="state terminal" />
  <text x="845" y="65" class="state-txt">REFUNDED_FULL</text>

  <!-- REFUNDED_PARTIAL -->
  <rect x="780" y="390" width="140" height="44" class="state terminal" />
  <text x="850" y="417" class="state-txt">REFUND_PARTIAL</text>

  <!-- NO_SHOW -->
  <rect x="590" y="390" width="120" height="44" class="state final" />
  <text x="650" y="417" class="state-txt">NO_SHOW</text>

  <!-- Arrows & Labels -->
  <!-- DRAFT -> QUOTED -->
  <path d="M 150 162 L 220 162" class="arrow-accent" />
  <text x="160" y="155" class="label-txt">quote()</text>

  <!-- QUOTED -> LINK_SENT -->
  <path d="M 330 162 L 400 162" class="arrow-accent" />
  <text x="334" y="155" class="label-txt">send_link</text>

  <!-- LINK_SENT -> APPROVED -->
  <path d="M 520 162 L 590 162" class="arrow-accent" />
  <text x="526" y="155" class="label-txt">webhook</text>

  <!-- APPROVED -> CAPTURED -->
  <path d="M 710 162 L 780 162" class="arrow-accent" />
  <text x="725" y="155" class="label-txt">capture()</text>

  <!-- CAPTURED -> IN_KITCHEN -->
  <path d="M 840 184 L 840 270" class="arrow-accent" />
  <text x="845" y="230" class="label-txt">kitchen_accept</text>

  <!-- IN_KITCHEN -> READY -->
  <path d="M 780 292 L 710 292" class="arrow-accent" />
  <text x="718" y="285" class="label-txt">mark_ready</text>

  <!-- READY -> PICKED_UP -->
  <path d="M 590 292 L 520 292" class="arrow-accent" />
  <text x="532" y="285" class="label-txt">pickup</text>

  <!-- READY -> NO_SHOW -->
  <path d="M 650 314 L 650 390" class="arrow" />
  <text x="656" y="355" class="label-txt">sweep_ttl</text>

  <!-- CAPTURED -> REFUNDED_FULL -->
  <path d="M 840 140 L 840 80" class="arrow" />
  <text x="846" y="115" class="label-txt">cancel_full</text>

  <!-- IN_KITCHEN -> REFUNDED_PARTIAL -->
  <path d="M 840 314 L 840 390" class="arrow" />
  <text x="846" y="355" class="label-txt">cancel_policy</text>

  <!-- LINK_SENT -> LINK_EXPIRED -->
  <path d="M 460 140 L 460 80" class="arrow" />
  <text x="466" y="115" class="label-txt">ttl_sweep</text>

  <!-- DRAFT -> CANCELLED -->
  <path d="M 100 184 L 100 412 L 135 412" class="arrow" />
  <text x="105" y="300" class="label-txt">cancel</text>

  <!-- LINK_SENT -> CANCELLED -->
  <path d="M 460 184 L 460 380 L 255 412" class="arrow" />
</svg>
