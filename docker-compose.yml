# Local stack: Postgres + Redis + API + worker + web. PayPal mode must be set explicitly;
# copy .env.example to .env and fill it in first (mock mode works without PayPal credentials).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: counter
      POSTGRES_PASSWORD: counter_local_only
      POSTGRES_DB: counter
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U counter -d counter"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://counter:counter_local_only@postgres:5432/counter
      REDIS_URL: redis://redis:6379/0
      RUN_WORKER_IN_PROCESS: "false"
      WEB_BASE_URL: http://localhost:3000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile.api }
    command: ["python", "-m", "apps.worker.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://counter:counter_local_only@postgres:5432/counter
      REDIS_URL: redis://redis:6379/0
      WEB_BASE_URL: http://localhost:3000
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args: { API_INTERNAL_URL: "http://api:8000" }
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
