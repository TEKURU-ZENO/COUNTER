[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counter"
version = "0.1.0"
description = "AI Phone Agent for Independent Takeaways with Guaranteed Deterministic Guard & PayPal Integration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "redis>=5.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "hypothesis>=6.103.0",
    "mutmut>=2.4.5",
    "coverage>=7.5.1",
    "mypy>=1.10.0",
    "ruff>=0.4.4",
]

[tool.hatch.build.targets.wheel]
packages = [
    "packages/domain",
    "packages/paypal_gateway",
    "packages/schemas",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "harness"]
pythonpath = [".", "packages", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

