[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "counter"
version = "0.2.0"
description = "Phone ordering agent for independent takeaways: an LLM picks tools, a deterministic guard and PayPal decide what money moves."
readme = "README.md"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["packages/domain", "packages/paypal_gateway", "packages/schemas", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "sandbox: talks to the real PayPal sandbox (needs credentials; run with -m sandbox)",
    "postgres: needs TEST_POSTGRES_URL pointing at a disposable Postgres database",
    "llm: calls a real LLM provider (needs an API key)",
]
addopts = "-m 'not sandbox and not postgres and not llm'"

[tool.coverage.run]
source = ["packages/domain"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["packages.domain.*"]
strict = true

[tool.mutmut]
paths_to_mutate = ["packages/domain/"]
tests_dir = ["tests/test_domain.py", "tests/test_guard_and_money.py"]
